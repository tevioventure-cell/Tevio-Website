<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/colors.css">
<link rel="stylesheet" href="../tokens/typography.css">
<link rel="stylesheet" href="../tokens/spacing.css">
<link rel="stylesheet" href="../tokens/radius.css">
<link rel="stylesheet" href="../tokens/shadows.css">
<style>body{margin:24px;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}</style>
<title>Toast & Tooltip</title>
<style>
.demo{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)}
.toasts{display:flex;flex-direction:column;gap:var(--space-3)}
.toast{display:flex;align-items:center;gap:var(--space-4);padding:14px var(--space-4);border-radius:var(--radius-md);box-shadow:var(--shadow-md);background:var(--surface-card);border-left:3px solid transparent;font:var(--weight-medium) var(--text-sm)/1 var(--font-body);max-width:380px}
.toast.success{border-color:var(--success)}
.toast.warning{border-color:var(--warning)}
.toast.danger{border-color:var(--danger)}
.toast.info{border-color:var(--navy-500)}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.toast.success .toast-dot{background:var(--success)}
.toast.warning .toast-dot{background:var(--warning)}
.toast.danger .toast-dot{background:var(--danger)}
.toast.info .toast-dot{background:var(--navy-500)}
.tooltip-row{display:flex;align-items:center;gap:var(--space-4)}
.tooltip-wrap{position:relative;display:inline-flex}
.tooltip-wrap:hover .tooltip{opacity:1}
.tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;font:var(--weight-regular) var(--text-xs)/1.4 var(--font-body);padding:6px 10px;border-radius:var(--radius-sm);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--duration-fast)}
.ref-btn{padding:8px 16px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-card);font:var(--weight-medium) var(--text-sm)/1 var(--font-body);cursor:default}
</style></head><body>
<div class="demo">
  <div class="toasts">
    <div class="toast success"><span class="toast-dot"></span>Brief submitted — we'll be in touch shortly.</div>
    <div class="toast warning"><span class="toast-dot"></span>Please fill all required fields before submitting.</div>
    <div class="toast danger"><span class="toast-dot"></span>Submission failed. Try again or email hello@tevio.in.</div>
    <div class="toast info"><span class="toast-dot"></span>Your agent is being configured. This takes 2–3 minutes.</div>
  </div>
  <div class="tooltip-row">
    <span style="font:500 13px/1 var(--font-body);color:var(--text-tertiary)">Hover to see tooltips →</span>
    <div class="tooltip-wrap"><button class="ref-btn">Process</button><span class="tooltip">Business & Process Consulting</span></div>
    <div class="tooltip-wrap"><button class="ref-btn">AI</button><span class="tooltip">AI Agents & Automation</span></div>
  </div>
</div>
</body></html>
