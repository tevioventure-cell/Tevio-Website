<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<style>body{margin:24px;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}</style>
<title>Body / Inter</title>
<style>.demo{padding:var(--space-4) 0;display:flex;flex-direction:column;gap:var(--space-5)}.row{display:flex;align-items:baseline;gap:var(--space-5)}.size{font:400 11px/1 var(--font-mono);color:var(--text-tertiary);min-width:36px}</style></head><body>
<div class="demo">
  <div class="row"><span class="size">22</span><span style="font:var(--weight-semibold) 22px/1.3 var(--font-body);color:var(--text-primary)">Section heading, large label</span></div>
  <div class="row"><span class="size">18</span><span style="font:var(--weight-medium) 18px/1.5 var(--font-body);color:var(--text-primary)">Subheading or key statement</span></div>
  <div class="row"><span class="size">16</span><span style="font:var(--weight-regular) 16px/1.65 var(--font-body);color:var(--text-secondary)">Body text — the main reading size for paragraphs, descriptions and form labels throughout the UI.</span></div>
  <div class="row"><span class="size">14</span><span style="font:var(--weight-regular) 14px/1.6 var(--font-body);color:var(--text-secondary)">Secondary body, card text, helper messages and inline descriptions.</span></div>
  <div class="row"><span class="size">12</span><span style="font:var(--weight-medium) 12px/1 var(--font-body);color:var(--text-tertiary);letter-spacing:var(--tracking-wide);text-transform:uppercase">MICRO LABEL · EYEBROW · TAG</span></div>
</div>
</body></html>
