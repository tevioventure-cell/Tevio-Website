<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<style>body{margin:24px;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}</style>
<title>Radius Scale</title>
<style>
.demo{padding:var(--space-4) 0;display:flex;gap:var(--space-5);flex-wrap:wrap;align-items:flex-end}
.sample{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.box{width:72px;height:48px;background:var(--navy-200);border:1px solid var(--navy-300)}
.label{font:400 11px/1 var(--font-mono);color:var(--text-tertiary);text-align:center}
</style></head><body>
<div class="demo">
  <div class="sample"><div class="box" style="border-radius:0"></div><span class="label">0</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="label">sm 8px</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-md)"></div><span class="label">md 12px</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="label">lg 16px</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="label">xl 22px</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-pill);width:80px;height:32px"></div><span class="label">pill</span></div>
  <div class="sample"><div class="box" style="border-radius:var(--radius-circle);width:48px;height:48px"></div><span class="label">circle</span></div>
</div>
</body></html>
