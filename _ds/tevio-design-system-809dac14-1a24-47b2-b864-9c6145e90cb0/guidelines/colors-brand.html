<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<style>body{margin:24px;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}</style>
<title>Brand Navy</title>
<style>
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;padding:var(--space-5) 0}
.swatch{display:flex;flex-direction:column;gap:6px;width:72px}
.chip{width:72px;height:48px;border-radius:var(--radius-md);border:1px solid rgba(0,0,0,.06)}
.name{font:var(--weight-medium) var(--text-xs)/1 var(--font-body);color:var(--text-secondary)}
.hex{font:400 11px/1 var(--font-mono);color:var(--text-tertiary)}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#081b2f"></div><span class="name">950</span><span class="hex">#081b2f</span></div>
  <div class="swatch"><div class="chip" style="background:#0e2947"></div><span class="name">900</span><span class="hex">#0e2947</span></div>
  <div class="swatch"><div class="chip" style="background:#153656"></div><span class="name">800</span><span class="hex">#153656</span></div>
  <div class="swatch"><div class="chip" style="background:#1e4468"></div><span class="name">700</span><span class="hex">#1e4468</span></div>
  <div class="swatch"><div class="chip" style="background:#2b567e"></div><span class="name">600</span><span class="hex">#2b567e</span></div>
  <div class="swatch"><div class="chip" style="background:#3d6b96"></div><span class="name">500</span><span class="hex">#3d6b96</span></div>
  <div class="swatch"><div class="chip" style="background:#6a8fb0"></div><span class="name">400</span><span class="hex">#6a8fb0</span></div>
  <div class="swatch"><div class="chip" style="background:#9fb8ce"></div><span class="name">300</span><span class="hex">#9fb8ce</span></div>
  <div class="swatch"><div class="chip" style="background:#cbdaea"></div><span class="name">200</span><span class="hex">#cbdaea</span></div>
  <div class="swatch"><div class="chip" style="background:#e6edf5"></div><span class="name">100</span><span class="hex">#e6edf5</span></div>
  <div class="swatch"><div class="chip" style="background:#f4f7fb"></div><span class="name">50</span><span class="hex">#f4f7fb</span></div>
</div>
</body></html>
