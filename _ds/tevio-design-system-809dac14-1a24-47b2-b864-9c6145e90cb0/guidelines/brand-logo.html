<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<style>body{margin:24px;background:var(--surface-sunken);font-family:var(--font-body);color:var(--text-primary)}</style>
<title>Logo</title>
<style>
.demo{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)}
.bg-white{background:var(--surface-card);padding:var(--space-8);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center}
.label{font:400 11px/1 var(--font-mono);color:var(--text-tertiary)}
img{height:36px;display:block}
</style></head><body>
<div class="demo">
  <div>
    <div class="bg-white"><img src="../assets/logo-wordmark-transparent.png" alt="Tevio wordmark"></div>
    <span class="label" style="display:block;margin-top:10px">Primary — white background</span>
  </div>
  <div>
    <div style="background:var(--navy-900);padding:var(--space-8);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center">
      <img src="../assets/logo-wordmark-transparent.png" alt="Tevio wordmark" style="filter:brightness(0) invert(1)">
    </div>
    <span class="label" style="display:block;margin-top:10px">Inverse — dark background (filter applied)</span>
  </div>
</div>
</body></html>
