<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tevio AI — KriyaOS Test</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:24px;color:#111}#chat{border:1px solid #ddd;border-radius:14px;padding:18px;min-height:280px;margin-bottom:16px}.msg{padding:10px 12px;margin:8px 0;border-radius:10px;background:#f5f5f5}.user{background:#111;color:#fff}.row{display:flex;gap:10px}input{flex:1;padding:13px;border:1px solid #ccc;border-radius:8px}button{padding:13px 20px;border:0;border-radius:8px;background:#111;color:#fff}button:disabled{opacity:.5}</style></head>
<body><h1>Tevio AI</h1><p>Private Preview — KriyaOS integration test</p><div id="chat"></div><div class="row"><input id="message" placeholder="Ask something…"><button id="send">Send</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('message'),send=document.getElementById('send');let sessionId=null;
function add(text,cls=''){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
async function ask(){const text=input.value.trim();if(!text)return;input.value='';add(text,'user');send.disabled=true;const pending=add('Thinking…');try{const r=await fetch('/api/kriya/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,sessionId})});const data=await r.json();if(!r.ok)throw new Error(data.error||data.message||('HTTP '+r.status));if(data.session?.id)sessionId=data.session.id;pending.textContent=data.message?.parts?.find(p=>p.type==='text')?.text||data.message?.text||data.text||JSON.stringify(data);}catch(e){pending.textContent='Connection error: '+e.message;}finally{send.disabled=false;input.focus();}}
send.onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
</script></body></html>
